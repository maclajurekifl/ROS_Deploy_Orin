


ekf_filter_node:
  ros__parameters:
    use_sim_time: true
    frequency: 50.0
    sensor_timeout: 0.1
    two_d_mode: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom
    publish_tf: true
    print_diagnostics: true

    imu0: /imu/data
    imu0_queue_size: 20
    imu0_nodelay: true

    imu0_config: [
      false, false, false,
      false, false, true,
      false, false, false,
      false, false, true,
      true,  true,  false
    ]

    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: true
