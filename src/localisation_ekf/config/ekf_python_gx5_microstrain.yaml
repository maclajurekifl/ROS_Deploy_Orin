ekf_node:
  ros__parameters:
    use_sim_time: true

    process_noise_diag:
      - 2.5e-4
      - 2.5e-4
      - 1.0e-6
      - 2.0e-7   # yaw (slightly lower Q → slower covariance growth between LiDAR updates)
      - 5.0e-3
      - 5.0e-3
      - 1.0e-8
      - 1.0e-8
      - 2.0e-9


    imu_topic: /imu/data
    predict_use_linear_accel: false
    nominal_dt: 0.025
    use_stamp_dt: true
    imu_stamp_offset_sec: 0.0
    imu_gyro_z_bias_rad_s: 0.0
    imu_auto_gyro_z_bias_enable: false
    imu_auto_gyro_z_bias_tune_sec: 4.0
    imu_gyro_z_scale: 1.0
    lidar_stamp_offset_sec: 0.0
    lidar_cloud_stamp_topic: /livox/lidar

    odom_frame: odom
    base_link_frame: base_link
    publish_tf: true
    transform_imu_to_base_link: true
    imu_tf_lookup_timeout_sec: 0.05
    imu_source_topic: /ekf/imu_source
    imu_source_id: microstrain

    initial_cov_diag:
      - 0.5
      - 0.5
      - 0.5
      - 0.5
      - 0.5
      - 0.5
      - 0.01
      - 0.01
      - 1.0e-3

    flat_orientation_variance: 1.0e-4

    publish_topic: /ekf/odom
    pose_topic: /ekf/pose
    path_topic: /ekf/path

    lidar_odom_topic: "/lidar/odom"
    lidar_delta_topic: ""
    lidar_delta_vel_var: 0.22
    lidar_delta_gate_nis: 200.0
    lidar_delta_nominal_dt_sec: 0.1
    lidar_pose_topic: ""
    lidar_z_topic: ""
    lidar_pose_var: 0.015
    lidar_yaw_var: 0.006
    lidar_z_var: 0.05
    lidar_require_frames: true
    lidar_fuse_z_from_odom: false
    lidar_gate_nis: 32.0
    lidar_use_roll_pitch: false
    lidar_fusion_debug_log: false
    lidar_fusion_debug_throttle_sec: 1.0
    lidar_soft_fuse_after_gate_reject: true
