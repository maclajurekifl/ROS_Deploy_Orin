# ekf_node — GX5 + LiDAR (see docs/tuning.md §3). Knobs = process_noise_diag only.
ekf_node:
  ros__parameters:
    # Overridden by launch_slam (default true). Bag replay needs true + `ros2 bag play --clock`.
    use_sim_time: true
    # =========================================================================
    # KNOBS — only parameters listed in docs/tuning.md §3
    # =========================================================================

    process_noise_diag:
      - 2.5e-4   # px
      - 2.5e-4   # py
      - 1.0e-6   # z
      - 2.0e-7   # yaw (slightly lower Q → slower covariance growth between LiDAR updates)
      - 5.0e-3   # vx
      - 5.0e-3   # vy
      - 1.0e-8   # bax
      - 1.0e-8   # bay
      # Gyro bias random walk (rad/s)^2 * dt; was too small → bgz barely learned from yaw meas.
      - 2.0e-9   # bgz

    # =========================================================================
    # REST (frames, topics, LiDAR R, P0 — launch + slam_bringup override much of this)
    # =========================================================================

    imu_topic: /imu/data
    # false: yaw from gyro; horizontal motion from LiDAR (accel in planar model skews with tilt/shock).
    predict_use_linear_accel: false
    nominal_dt: 0.025
    use_stamp_dt: true
    imu_stamp_offset_sec: 0.0
    # Subtracted from ωz after TF to base_link (see ekf_node). Set ≈ stationary mean to remove bias drift.
    imu_gyro_z_bias_rad_s: 0.0
    imu_auto_gyro_z_bias_enable: false
    imu_auto_gyro_z_bias_tune_sec: 4.0
    imu_gyro_z_scale: 1.0
    lidar_stamp_offset_sec: 0.0
    lidar_cloud_stamp_topic: /livox/lidar

    odom_frame: odom
    base_link_frame: base_link
    publish_tf: true
    transform_imu_to_base_link: true
    imu_tf_lookup_timeout_sec: 0.05
    imu_source_topic: /ekf/imu_source
    imu_source_id: microstrain

    initial_cov_diag:
      - 0.5
      - 0.5
      - 0.5
      - 0.5
      - 0.5
      - 0.5
      - 0.01
      - 0.01
      - 1.0e-3   # bgz — allow faster initial bias learn (tighten after calibration)

    flat_orientation_variance: 1.0e-4

    publish_topic: /ekf/odom
    pose_topic: /ekf/pose
    path_topic: /ekf/path

    lidar_odom_topic: "/lidar/odom"
    # Optional TwistStamped planar delta (same as lidar_odometry delta_topic); launch sets from slam_bringup.
    lidar_delta_topic: ""
    lidar_delta_vel_var: 0.22
    lidar_delta_gate_nis: 200.0
    lidar_delta_nominal_dt_sec: 0.1
    lidar_pose_topic: ""
    lidar_z_topic: ""
    lidar_pose_var: 0.015
    lidar_yaw_var: 0.006
    lidar_z_var: 0.05
    lidar_require_frames: true
    lidar_fuse_z_from_odom: false
    lidar_gate_nis: 32.0
    lidar_use_roll_pitch: false
    # Launch overrides from slam_bringup; defaults match ekf_node.
    lidar_fusion_debug_log: false
    lidar_fusion_debug_throttle_sec: 1.0
    lidar_soft_fuse_after_gate_reject: true
