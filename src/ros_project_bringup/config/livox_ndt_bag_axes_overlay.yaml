slam_bringup:
  use_lio: false
  use_lidar_fusion: true
  keyframe_deskew_imu_follow_ekf: true
  livox_extrinsic_yaw_deg: 180.0
  livox_imu_bridge_yaw_deg: 180.0
  microstrain_sensor_alias_yaw_deg: 0.0
  ekf_lidar_odom_topic: /lidar/odom_raw
  ekf_lidar_pose_var: 0.015
  ekf_lidar_yaw_var: 0.018
  ekf_lidar_fusion_debug_log: true
  ekf_lidar_fusion_debug_throttle_sec: 2.0
  ekf_lidar_fuse_xy_only: true
  ekf_imu_gyro_z_bias_rad_s: 0.0
  ekf_imu_auto_gyro_z_bias_enable: true
  ekf_imu_auto_gyro_z_bias_tune_sec: 5.0
  ekf_lidar_gate_nis: 64.0
  ekf_predict_use_linear_accel: false
  lidar_voxel_leaf_size: 0.15
  lidar_ndt_resolution: 0.65
  lidar_ndt_voxel_min_points: 12
  lidar_ndt_voxel_cov_eig_inflation_ratio: 0.08
  lidar_ndt_step_size: 0.05
  lidar_ndt_max_iterations: 55
  lidar_ndt_coarse_resolution: 1.2
  lidar_scan_to_map_register_sensor_frame: true
  lidar_use_tf_initial_guess: false
  lidar_ndt_gate_until_prior_translation_m: 0.0
  lidar_log_accumulated_pose: true
  lidar_log_ndt_relative: true
  lidar_ndt_fuse_prior_planar_yaw: true
  lidar_ndt_prior_yaw_blend: 0.9
  lidar_ndt_fallback_if_planar_correction_below_m: 0.03
  lidar_ndt_corridor_spin_yaw_min_rad: 0.2
  lidar_ndt_corridor_spin_max_corr_xy_m: 0.05
  lidar_ndt_reject_opposite_ekf_step: true
  lidar_map_merge_keyframe_min_translation_m: 0.3
  lidar_map_merge_keyframe_min_yaw_deg: 10.0
